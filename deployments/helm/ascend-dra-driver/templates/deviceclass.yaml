{{- if not .Values.kubeletPlugin.fullCardAndTraditionalVNPU.enabled }}
apiVersion: resource.k8s.io/v1
kind: DeviceClass
metadata:
  name: npu-hamivnpucore.project-hami.io
  labels:
    {{- include "ascend-dra-driver.labels" . | nindent 4 }}
spec:
  selectors:
  - cel:
      expression: |-
        device.driver == "ascend.project-hami.io" &&
        device.attributes["ascend.project-hami.io"].type == "HAMivNPUCore"
{{- end }}
