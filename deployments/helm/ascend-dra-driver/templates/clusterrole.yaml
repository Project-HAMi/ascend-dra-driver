---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "ascend-dra-driver.fullname" . }}-role
  namespace: {{ include "ascend-dra-driver.namespace" . }}
rules:
{{- if and .Values.kubeletPlugin.metrics.enabled (not .Values.kubeletPlugin.fullCardAndTraditionalVNPU.enabled) }}
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
{{- end }}
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceclaims"]
  verbs: ["create", "get"]
- apiGroups: [""]
  resources: ["nodes", "namespaces"]
  verbs: ["get", "create", "list"]
- apiGroups: ["resource.k8s.io"]
  resources: ["resourceslices", "deviceclasses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
