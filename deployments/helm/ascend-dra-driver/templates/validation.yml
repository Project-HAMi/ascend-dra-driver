{{- if .Values.namespace }}
{{- $error := "" }}
{{- $error = printf "%s\nValue 'namespace' set to %s" $error .Values.namespace }}
{{- $error = printf "%s\nSetting an explicit 'namespace' in values.yaml or via --set on the command line is no longer supported." $error }}
{{- $error = printf "%s\nUse --namespace (with --create-namespace as necessary) instead." $error }}
{{- $error = printf "%s\nSee: https://helm.sh/docs/helm/helm_install/#options" $error }}
{{- fail $error }}
{{- end }}

{{- if and (eq (include "ascend-dra-driver.namespace" .) "default") ( eq .Values.namespaceOverride "") (not .Values.allowDefaultNamespace) }}
{{- $error := "" }}
{{- $error = printf "%s\nRunning in the 'default' namespace is not recommended." $error }}
{{- $error = printf "%s\nSet 'allowDefaultNamespace=true' to bypass this error." $error }}
{{- $error = printf "%s\nOtherwise, use --namespace (with --create-namespace as necessary) to run in a specific namespace." $error }}
{{- $error = printf "%s\nSee: https://helm.sh/docs/helm/helm_install/#options" $error }}
{{- fail $error }}
{{- end }}

{{- if not (kindIs "bool" .Values.kubeletPlugin.fullCardAndTraditionalVNPU.enabled) }}
{{- fail "kubeletPlugin.fullCardAndTraditionalVNPU.enabled must be a boolean" }}
{{- end }}

{{- if not (kindIs "bool" .Values.kubeletPlugin.metrics.enabled) }}
{{- fail "kubeletPlugin.metrics.enabled must be a boolean" }}
{{- end }}
{{- if not (kindIs "bool" .Values.kubeletPlugin.metrics.serviceMonitor.enabled) }}
{{- fail "kubeletPlugin.metrics.serviceMonitor.enabled must be a boolean" }}
{{- end }}
{{- $port := .Values.kubeletPlugin.metrics.port }}
{{- if or (not (regexMatch "^[0-9]+$" (toString $port))) (lt (int $port) 1) (gt (int $port) 65535) }}
{{- fail "kubeletPlugin.metrics.port must be an integer in [1,65535]" }}
{{- end }}
{{- range $name, $value := dict "collectionInterval" .Values.kubeletPlugin.metrics.collectionInterval "maxAge" .Values.kubeletPlugin.metrics.maxAge "serviceMonitor.interval" .Values.kubeletPlugin.metrics.serviceMonitor.interval }}
{{- if or (not (kindIs "string" $value)) (empty $value) }}
{{- fail (printf "kubeletPlugin.metrics.%s must be a non-empty string" $name) }}
{{- end }}
{{- end }}
{{- if not (kindIs "map" .Values.kubeletPlugin.metrics.serviceMonitor.labels) }}
{{- fail "kubeletPlugin.metrics.serviceMonitor.labels must be a map of strings" }}
{{- end }}
{{- range $value := .Values.kubeletPlugin.metrics.serviceMonitor.labels }}
{{- if not (kindIs "string" $value) }}
{{- fail "kubeletPlugin.metrics.serviceMonitor.labels must be a map of strings" }}
{{- end }}
{{- end }}
