name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  GO_VERSION: "1.26.2"

jobs:
  changes:
    name: Detect build changes
    runs-on: ubuntu-latest
    outputs:
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.build == 'true' }}
    steps:
      - name: Detect build-relevant PR changes
        if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            build:
              - '**/*.go'
              - '**/*.c'
              - '**/*.h'
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'go.mod'
              - 'go.sum'
              - 'go.work'
              - 'go.work.sum'
              - '.golangci.yml'
              - '.gitmodules'
              - 'Makefile'
              - 'common.mk'
              - 'hami-vnpu-core'
              - 'hami-vnpu-core/**'
              - 'third_party/**'
              - 'deployments/container/**'
              - '.github/actions/**'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Verify Go module files
        shell: bash
        run: |
          set -euo pipefail
          find third_party/mind-cluster/component -mindepth 1 -maxdepth 1 \
            -type d ! -name ascend-common -exec rm -rf {} +
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: make assert-fmt

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.12.2
          install-mode: goinstall
          args: --timeout=10m ./api/... ./cmd/... ./pkg/...

  test:
    name: Unit test
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Run tests
        run: make test

      - name: Upload coverage to Codecov
        if: ${{ github.repository == 'Project-HAMi/hami-dra-driver' }}
        uses: codecov/codecov-action@v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.out
          flags: unittests
          fail_ci_if_error: false
          verbose: true

  build-vnpu:
    name: Build libvnpu
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-22.04-arm
    container:
      image: ghcr.io/dsfans2014/ascend-device-plugin/ascend-lib:0.2
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2.9.2
        with:
          workspaces: hami-vnpu-core

      - name: Build libvnpu artifacts
        run: cargo build --release
        working-directory: hami-vnpu-core

      - name: Prepare libvnpu artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/hami-vnpu-core
          cp hami-vnpu-core/target/release/libvnpu.so dist/hami-vnpu-core/
          echo "/hami-vnpu-core/libvnpu.so" > dist/hami-vnpu-core/ld.so.preload

      - name: Upload libvnpu artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: libvnpu-artifacts
          if-no-files-found: error
          path: dist/hami-vnpu-core/*
          retention-days: 1

  build-image:
    name: Build image
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - test
      - build-vnpu
    if: needs.changes.outputs.build == 'true'
    env:
      IMAGE_NAME: ${{ secrets.IMAGE_NAME || 'projecthami/ascend-dra-driver' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          submodules: recursive

      - name: Download libvnpu artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: libvnpu-artifacts
          path: dist/hami-vnpu-core

      - name: Verify libvnpu artifacts
        run: make verify-libvnpu-artifacts

      - name: Log in to Docker Hub
        if: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_TOKEN }}
          password: ${{ secrets.DOCKERHUB_PASSWD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.2.0

      - name: Resolve image metadata
        id: image
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            version="${GITHUB_REF_NAME}"
            tag="${GITHUB_REF_NAME}"
          else
            version="${GITHUB_REF_NAME:-main}-${GITHUB_SHA}"
            tag="latest"
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          } >>"${GITHUB_OUTPUT}"

      - name: Build and push image
        uses: docker/build-push-action@v7.3.0
        with:
          context: .
          file: deployments/container/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main') }}
          build-args: |
            BASE_IMAGE=ubuntu:20.04
            GOLANG_VERSION=${{ env.GO_VERSION }}
            VERSION=${{ steps.image.outputs.version }}
            REVISION=${{ github.sha }}
            BUILD_DATE=${{ steps.image.outputs.build_date }}
          tags: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

  ci-required:
    name: CI Required
    runs-on: ubuntu-latest
    needs:
      - changes
      - lint
      - test
      - build-vnpu
      - build-image
    if: always()
    steps:
      - name: Check CI result
        shell: bash
        run: |
          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Build change detection did not complete successfully: ${{ needs.changes.result }}"
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.build }}" != "true" ]]; then
            echo "No build-relevant changes; compilation jobs were skipped."
            exit 0
          fi

          for result in \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.build-vnpu.result }}" \
            "${{ needs.build-image.result }}"; do
            if [[ "${result}" != "success" ]]; then
              echo "A required CI job did not complete successfully: ${result}"
              exit 1
            fi
          done
